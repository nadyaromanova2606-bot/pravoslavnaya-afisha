<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ef">
  <title>Выбор категории</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 18px;
      min-height: 100vh;
      background: #f7f5ef;
      color: #263b35;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .heading {
      text-align: center;
      margin: 12px 0 26px;
    }

    .heading .symbol {
      font-size: 34px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      margin: 0 0 9px;
    }

    .subtitle {
      color: #777d75;
      font-size: 14px;
      line-height: 1.5;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 16px;
      min-height: 58px;
      background: #fff;
      border: 1px solid #e7e4da;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      transition: border-color 0.15s, background 0.15s;
    }

    .category.selected {
      border: 2px solid #537765;
      background: #edf3ed;
      padding: 15px;
    }

    .category input {
      width: 19px;
      height: 19px;
      margin: 0;
      accent-color: #537765;
      flex-shrink: 0;
    }

    .category .emoji {
      font-size: 21px;
      width: 26px;
      text-align: center;
    }

    .done {
      width: 100%;
      margin-top: 24px;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: #426653;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .done:active {
      opacity: 0.85;
    }

    .note {
      margin-top: 14px;
      text-align: center;
      color: #85877f;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="heading">
      <div class="symbol">☦️</div>
      <h1>Выберите категорию</h1>
      <div class="subtitle">
        Выберите, какие мероприятия вы хотите видеть в афише
      </div>
    </header>

    <section class="category-list" id="categoryList">
      <label class="category selected">
        <input type="radio" name="category" value="cat_all" checked>
        <span class="emoji">🌟</span>
        <span>Все мероприятия</span>
      </label>

      <label class="category">
        <input type="radio" name="category" value="cat_culture">
        <span class="emoji">🏛️</span>
        <span>Культурные события</span>
      </label>

      <label class="category">
        <input type="radio" name="category" value="cat_lectures">
        <span class="emoji">🎓</span>
        <span>Лекции</span>
      </label>

      <label class="category">
        <input type="radio" name="category" value="cat_bible">
        <span class="emoji">📖</span>
        <span>Библейские чтения</span>
      </label>

      <label class="category">
        <input type="radio" name="category" value="cat_trips">
        <span class="emoji">🚌</span>
        <span>Поездки</span>
      </label>

      <label class="category">
        <input type="radio" name="category" value="cat_entertainment">
        <span class="emoji">🎉</span>
        <span>Развлечения</span>
      </label>

      <label class="category">
        <input type="radio" name="category" value="cat_books">
        <span class="emoji">📚</span>
        <span>Книжные клубы</span>
      </label>

      <label class="category">
        <input type="radio" name="category" value="cat_sport">
        <span class="emoji">⚽</span>
        <span>Спорт</span>
      </label>

      <label class="category">
        <input type="radio" name="category" value="cat_volunteer">
        <span class="emoji">🤝</span>
        <span>Волонтёрство</span>
      </label>
    </section>

    <button class="done" id="doneButton">Готово</button>
    <div class="note">Можно выбрать только одну категорию</div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const categories = document.querySelectorAll(".category");

    categories.forEach((item) => {
      item.addEventListener("click", () => {
        categories.forEach((category) => {
          category.classList.remove("selected");
        });
        item.classList.add("selected");
      });
    });

    document.getElementById("doneButton").addEventListener("click", async () => {
  const selected = document.querySelector(
    'input[name="category"]:checked'
  );

  if (!selected) {
    alert("Пожалуйста, выберите категорию");
    return;
  }

  const tg = window.Telegram?.WebApp;

  if (!tg || !tg.initData) {
    alert("Откройте выбор категории через Telegram");
    return;
  }

  const button = document.getElementById("doneButton");
  button.disabled = true;
  button.textContent = "Сохраняем…";

  try {
    const response = await fetch("https://spblitguidebot.app.n8n.cloud/webhook/save-category", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        initData: tg.initData,
        category: selected.value
      })
    });

    if (!response.ok) {
      throw new Error("Ошибка сохранения: " + response.status);
    }

    tg.close();

  } catch (error) {
    console.error(error);
    alert("Не удалось сохранить категорию. Попробуйте ещё раз.");
    button.disabled = false;
    button.textContent = "Готово";
  }
});
  </script>
</body>
</html>
